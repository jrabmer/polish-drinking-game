<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polish Drinking Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- ================= SETUP SCREEN ================= -->
    <section id="setupScreen" class="screen">
      <div class="card">
        <h1>Polish Drinking Game</h1>
        <p id="setupSubtitle" class="subtitle"></p>

        <p id="loadError" class="load-error hidden"></p>

        <label class="field">
          <span id="labelBoard"></span>
          <select id="configSelect"></select>
        </label>

        <label class="field">
          <span id="labelLang"></span>
          <select id="langSelect"></select>
        </label>

        <label class="field">
          <span id="labelTheme"></span>
          <select id="themeSelect"></select>
        </label>

        <label class="field field-check">
          <input type="checkbox" id="speakField" />
          <span id="labelSpeak"></span>
        </label>

        <label class="field">
          <span id="labelCount"></span>
          <select id="playerCount"></select>
        </label>

        <div id="nameInputs" class="name-inputs"></div>

        <button id="startBtn" class="btn btn-primary btn-block"></button>

        <details class="rules">
          <summary id="howSummary"></summary>
          <ul id="rulesList"></ul>
        </details>
      </div>
    </section>

    <!-- ================= GAME SCREEN ================= -->
    <section id="gameScreen" class="screen hidden">
      <header class="topbar">
        <div id="turnInfo" class="turn-info">&nbsp;</div>
        <div class="topbar-actions">
          <button id="speakBtn" class="icon-btn" type="button" aria-pressed="false">🔇</button>
          <select id="themeSelectTop" class="lang-mini"></select>
          <select id="langSelectTop" class="lang-mini"></select>
        </div>
        <!-- sibling of .topbar-actions so it can stay top-right on a phone
             while the selects drop to their own row (CSS 'order' keeps it
             last on wide screens) -->
        <button id="resetBtn" class="btn btn-ghost"></button>
      </header>

      <div class="board-wrap">
        <div id="boardDeco" class="board-deco" aria-hidden="true">
          <!-- wine glass -->
          <div class="deco-item d-tl"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6h28c1.4 0 2.4 1.2 2.2 2.6C46.8 24 40.6 32 34 34.4V50h9a2 2 0 0 1 0 4H21a2 2 0 0 1 0-4h9V34.4C23.4 32 17.2 24 15.8 8.6 15.6 7.2 16.6 6 18 6Z" fill="#f7f2e4" stroke="#5b3b2e" stroke-width="2"/>
            <path d="M20 11h24c-1.1 9.5-5.4 15.6-12 18-6.6-2.4-10.9-8.5-12-18Z" fill="#7c1d2b"/>
          </svg></div>
          <!-- cheese wedge -->
          <div class="deco-item d-tr"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <polygon points="7,45 51,21 57,30 13,54" fill="#e6a92f" stroke="#a9741a" stroke-width="2"/>
            <polygon points="7,45 51,21 51,14 7,38" fill="#f6d074" stroke="#a9741a" stroke-width="2"/>
            <polygon points="7,38 7,45 13,54 13,47" fill="#f2c057" stroke="#a9741a" stroke-width="2"/>
            <circle cx="22" cy="43" r="3" fill="#a9741a"/><circle cx="33" cy="37" r="2.3" fill="#a9741a"/><circle cx="42" cy="32" r="1.8" fill="#a9741a"/>
          </svg></div>
          <!-- grapes -->
          <div class="deco-item d-bl"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M33 14c3-5 8-7 13-6" stroke="#5f8f3c" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M40 9c5 1 8 4 9 9" stroke="#5f8f3c" stroke-width="3" fill="none" stroke-linecap="round"/>
            <g fill="#6a3fa0" stroke="#472a70" stroke-width="1.4">
              <circle cx="25" cy="21" r="6"/><circle cx="37" cy="21" r="6"/>
              <circle cx="19" cy="31" r="6"/><circle cx="31" cy="31" r="6"/><circle cx="43" cy="31" r="6"/>
              <circle cx="25" cy="41" r="6"/><circle cx="37" cy="41" r="6"/><circle cx="31" cy="51" r="6"/>
            </g>
          </svg></div>
          <!-- cheese wheel -->
          <div class="deco-item d-br"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 32v8a24 12 0 0 0 48 0v-8Z" fill="#e6a92f" stroke="#a9741a" stroke-width="2"/>
            <ellipse cx="32" cy="32" rx="24" ry="12" fill="#f6d074" stroke="#a9741a" stroke-width="2"/>
            <path d="M32 32 32 20a24 12 0 0 1 18 6Z" fill="#fff3d0" stroke="#a9741a" stroke-width="1.6"/>
          </svg></div>
          <!-- wine bottle -->
          <div class="deco-item d-tc"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="28" y="4" width="8" height="13" rx="1.5" fill="#3d2a1c"/>
            <path d="M27 17c0 7-1 9-4 14s-4 8-4 13v13a3 3 0 0 0 3 3h20a3 3 0 0 0 3-3V44c0-5-1-8-4-13s-4-7-4-14Z" fill="#33613c" stroke="#1f3d27" stroke-width="2"/>
            <rect x="20" y="42" width="24" height="13" fill="#f4ecd6"/>
            <circle cx="32" cy="48.5" r="3.4" fill="#7c1d2b"/>
          </svg></div>
          <!-- cheese block -->
          <div class="deco-item d-bc"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 24 44 14 54 22 20 32Z" fill="#f6d074" stroke="#a9741a" stroke-width="2"/>
            <path d="M20 32 54 22 54 44 20 54Z" fill="#e6a92f" stroke="#a9741a" stroke-width="2"/>
            <path d="M10 24 20 32 20 54 10 46Z" fill="#d3922a" stroke="#a9741a" stroke-width="2"/>
            <circle cx="31" cy="42" r="3" fill="#a9741a"/><circle cx="42" cy="34" r="2.4" fill="#a9741a"/>
          </svg></div>
        </div>
        <div id="board" class="board"></div>
      </div>

      <div class="controls">
        <div id="die" class="die" aria-label="die">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
        <button id="rollBtn" class="btn btn-primary"></button>
        <div id="rollMsg" class="roll-msg">&nbsp;</div>
      </div>

      <ul id="playerPanel" class="player-panel"></ul>
    </section>

    <!-- ================= FIELD MODAL ================= -->
    <div id="tileModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box">
        <h2 id="tileTitle">Field</h2>
        <button id="replaySpeak" class="icon-btn" type="button">🔊</button>
        <p id="tileTask" class="tile-task"></p>
        <p id="tileNote" class="tile-note hidden"></p>
        <div id="tileEffect" class="tile-effect"></div>
        <div id="tileActions" class="tile-actions"></div>
      </div>
    </div>

    <!-- ================= RESET / CONFIRM MODAL ================= -->
    <div id="confirmModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box">
        <h2 id="confirmTitle"></h2>
        <p id="confirmText"></p>
        <div class="tile-actions">
          <button id="confirmRestart" class="btn"></button>
          <button id="confirmNew" class="btn"></button>
          <button id="confirmCancel" class="btn btn-ghost"></button>
        </div>
      </div>
    </div>

    <!-- ================= WIN MODAL ================= -->
    <div id="winModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-box">
        <h2 id="winTitleH"></h2>
        <p id="winText"></p>
        <p id="winFlavour" class="tile-note"></p>
        <div class="tile-actions">
          <button id="winAgain" class="btn btn-primary"></button>
          <button id="winNew" class="btn btn-ghost"></button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
